    lead: "研究方向：智能体深度强化学习与智能决策"
    intro: "我目前就读于中南大学电子信息学院，导师为桂劲松教授。2024年，我以优异成绩从安徽理工大学推荐免试至中南大学攻读硕士学位。目前，我的研究主要围绕<strong>深度强化学习算法及其应用</strong>展开，关注<strong>智能体在复杂环境中的高效决策与协同优化</strong>，研究场景包括<strong>多智能体协同决策、无线通信资源优化与具身智能控制等。</strong> "
    focusLabel: "个人技能："
    focusText: "<ul><li>熟练使用 Python、PyTorch 进行强化学习模型开发与实验分析；</li><li>掌握 DQN、SAC、PPO、QMIX 等主流强化学习算法及其核心机制；</li><li>具备强化学习环境建模与多智能体协同决策任务设计能力；</li><li>熟悉 LLM/Agent 技术，包括 Prompt、RAG、Tool Calling 与 LangGraph；</li><li>具备 Agent 系统设计与多步骤决策能力</li></ul>"
